<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuppa Town — Sydney Cafe Map</title>
<meta name="description" content="Every Sydney café starts as a white clay miniature. Visit, snap the front and paint it with real colours.">
<link rel="icon" href="icon.png">
<style>
  :root { --ink:#3D352A; --muted:#6E6352; --mustard:#E2B451; --cream:#FBF7EF; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--mustard); color:var(--ink); font:17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  main { max-width:960px; margin:0 auto; padding:48px 16px 32px; text-align:center; }
  .icon { width:112px; height:112px; border-radius:25px; box-shadow:0 10px 30px rgba(61,53,42,.25); }
  h1 { font-size:44px; line-height:1.1; margin:20px 0 6px; letter-spacing:-.5px; }
  .tag { font-size:20px; font-weight:600; margin:0 0 4px; }
  .ko { color:var(--muted); margin:0 0 24px; }
  .soon { display:inline-block; background:var(--ink); color:var(--cream); border-radius:999px; padding:10px 20px; font-weight:700; font-size:15px; }
  .shots { display:flex; gap:20px; justify-content:center; margin:40px 0 8px; flex-wrap:wrap; }
  .shots img { width:min(300px, 80vw); border-radius:28px; box-shadow:0 14px 40px rgba(61,53,42,.3); }
  footer { background:var(--cream); padding:24px 16px; text-align:center; font-size:15px; }
  footer a { color:var(--ink); font-weight:700; margin:0 10px; }
  footer p { color:var(--muted); margin:10px 0 0; font-size:13px; }
</style>
</head>
<body>
<main>
  <img class="icon" src="icon.png" alt="Cuppa Town app icon">
  <h1>Cuppa Town</h1>
  <p class="tag">Paint Sydney's cafés, one visit at a time.</p>
  <p class="ko">다녀온 시드니 카페를 내 사진 색으로 칠하는 지도</p>
  <span class="soon">Coming soon to the App Store</span>
  <div class="shots">
    <img src="shot-map.png" alt="Map of Sydney cafés as clay miniatures, some painted in colour">
    <img src="shot-paint.png" alt="Painting a café miniature with colours from a storefront photo">
  </div>
</main>
<footer>
  <a href="support.html">Support · 고객 지원</a>
  <a href="privacy.html">Privacy Policy · 개인정보처리방침</a>
  <p>Map data © OpenStreetMap contributors</p>
</footer>
</body>
</html>
